<body><div class="box"><h1>Proyecto85 Pro · Reset 1.5.1</h1><p>Elimina cachés antiguas sin borrar tus datos guardados.</p><button onclick="go()">Limpiar y abrir 1.5.1</button><p id="s"></p></div>
<script>
async function go(){
 document.getElementById('s').textContent='Limpiando…';
 try{
  if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations()){try{await r.unregister()}catch(e){}}}
  if('caches' in window){for(const k of await caches.keys()){try{await caches.delete(k)}catch(e){}}}
 }catch(e){}
 location.replace('./index.html?v=151&ts='+Date.now());
}
